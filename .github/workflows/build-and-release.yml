name: Build and release Robbo

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          check-latest: true
          cache: npm

      - run: npm ci
      - run: npm run test:tooling
      - name: Set preview metadata path
        run: echo "ROBBO_RELEASE_CONTEXT=$RUNNER_TEMP/robbo-release.json" >> "$GITHUB_ENV"
      - name: Identify pull request preview
        run: node scripts/release/pr-release.cjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm run test:input
      - run: npm run test:session-browser
      - run: npm run test:viewport
      - run: npm run test:artwork
      - run: node tests/browser/render-performance.check.cjs
      - name: Check viewport layout in Firefox
        run: node tests/browser/viewport.check.cjs
        env:
          ROBBO_BROWSER: firefox
      - run: npm run package
      - run: cd release && zip -r robbo.zip robbo

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/robbo

      - uses: actions/upload-artifact@v4
        with:
          name: robbo
          path: release/robbo.zip

      - name: Publish pull request preview
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: node scripts/release/pr-release.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="build-$GITHUB_SHA"
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release/robbo.zip --clobber
          else
            gh release create "$release_tag" release/robbo.zip --target "$GITHUB_SHA" --title "Robbo $release_tag" --generate-notes --latest
          fi

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
